<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កម្មវិធីបង្កើតរបាយការណ៍ប្រចាំបញ្ជា</title>
    
    <meta name="theme-color" content="#1a365d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="របាយការណ៍">
    <link rel="apple-touch-icon" href="image1.jpg">
    <link rel="icon" type="image/jpeg" href="image1.jpg">
    
    <link rel="manifest" id="manifestPlaceholder">
    <script src="https://cdn.jsdelivr.net/gh/ThyrithSor/momentkh@3.0.3/momentkh.js"></script>
    
    <style>
        body {
            font-family: 'Khmer OS Battambang', 'Kantumruy Pro', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .app-header { text-align: center; margin-bottom: 20px; }
        .app-logo {
            width: 110px; height: 110px; object-fit: cover; border-radius: 50%;
            margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        h2 { text-align: center; color: #1a365d; margin: 0 0 20px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        select, input[type="text"], input[type="number"], input[type="date"], textarea {
            width: 100%; height: 42px; padding: 8px 10px; border: 1px solid #ccc;
            border-radius: 6px; box-sizing: border-box; font-size: 15px; font-family: inherit;
        }
        .row { display: flex; gap: 12px; align-items: flex-end; }
        .row .form-group { flex: 1; margin-bottom: 15px; }
        textarea { height: 180px !important; resize: vertical; background-color: #fcfcfc; line-height: 1.6; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 6px;
            font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s;
            min-width: 140px;
        }
        .btn-generate { background-color: #2b6cb0; color: white; }
        .btn-generate:hover { background-color: #2c5282; }
        .btn-copy { background-color: #38a169; color: white; }
        .btn-copy:hover { background-color: #2f855a; }
        .btn-telegram { background-color: #0088cc; color: white; }
        .btn-telegram:hover { background-color: #006699; }
        .btn-add-photo { background-color: #4a5568; color: white; display: inline-block; text-align: center; line-height: 20px; }
        .btn-add-photo:hover { background-color: #2d3748; }

        /* Styling រូបភាព និងប៊ូតុងបន្ថែម */
        .image-preview-container {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .image-preview-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
        }
        .image-preview-item {
            width: 100%; height: 100%; object-fit: cover; border-radius: 8px;
            border: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .remove-img-btn {
            position: absolute; top: -6px; right: -6px; background: #e53e3e;
            color: white; border: none; border-radius: 50%; width: 22px; height: 22px;
            font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
        }
        .add-more-box {
            width: 90px; height: 90px; border: 2px dashed #0088cc; border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; background: #ebf8ff; color: #0088cc; font-weight: bold; font-size: 12px;
            text-align: center; box-sizing: border-box;
        }
        .add-more-box span { font-size: 22px; line-height: 22px; }

        .toast {
            visibility: hidden; min-width: 250px; background-color: rgba(51, 51, 51, 0.95);
            color: #fff; text-align: center; border-radius: 8px; padding: 16px 24px;
            font-size: 16px; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000;
        }
        .toast.show { visibility: visible; animation: fadeInOut 3s forwards; }

        .app-license {
            margin-top: 25px; padding-top: 15px; border-top: 1px dashed #cbd5e0;
            text-align: center; font-size: 13px; color: #4a5568;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -40%); }
            15% { opacity: 1; transform: translate(-50%, -50%); }
            85% { opacity: 1; transform: translate(-50%, -50%); }
            100% { opacity: 0; transform: translate(-50%, -60%); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="app-header">
        <img src="image1.jpg" alt="App Logo" class="app-logo">
        <h2>📝 កម្មវិធីបង្កើតរបាយការណ៍ប្រចាំបញ្ជា</h2>
    </div>
    
    <div class="row">
        <div class="form-group">
            <label for="shiftTime">ជ្រើសរើសពេល៖</label>
            <select id="shiftTime" onchange="autoFillTime()">
                <option value="ព្រឹក">នាព្រឹក</option>
                <option value="រសៀល">នារសៀល</option>
                <option value="យប់">នាយប់</option>
            </select>
        </div>
        <div class="form-group">
            <label for="timeText">វេលាម៉ោង៖</label>
            <input type="text" id="timeText" value="០៨និង ០០នាទី">
        </div>
    </div>

    <div class="row">
        <div class="form-group" style="flex: 0.4;">
            <label for="datePicker">ជ្រើសរើសថ្ងៃខែឆ្នាំ៖</label>
            <input type="date" id="datePicker" onchange="updateKhmerDate()">
        </div>
        <div class="form-group" style="flex: 0.6;">
            <label for="dateText">កាលបរិច្ឆេទចន្ទគតិ (ស្វ័យប្រវត្តិ)៖</label>
            <input type="text" id="dateText" value="">
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label for="totalForce">កម្លាំងមានមុខជាក់ស្ដែង (រូប)៖</label>
            <input type="number" id="totalForce" value="23" oninput="calculateDeptForce()">
        </div>
        <div class="form-group">
            <label for="deputyChief">ស្នងការរង (រូប)៖</label>
            <input type="number" id="deputyChief" value="1" oninput="calculateDeptForce()">
        </div>
        <div class="form-group">
            <label for="deptForce">កម្លាំងការិ. សរុប (រូប)៖</label>
            <input type="number" id="deptForce" value="22">
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label for="receiverName">ឈ្មោះលោកឧត្តមសេនីយ៍ត្រី (អ្នកទទួល)៖</label>
            <input type="text" id="receiverName" value="ជា ចិត្រា">
        </div>
        <div class="form-group">
            <label for="senderName">ឈ្មោះលោកឧត្តមសេនីយ៍ត្រី (អ្នករាយការណ៍)៖</label>
            <input type="text" id="senderName" value="កែវ រតនា">
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-generate" onclick="generateReport()">បង្កើតរបាយការណ៍</button>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <!-- ផ្នែកជ្រើសរើស/ថតរូបភាព -->
    <div class="form-group">
        <label>📷 រូបភាពភ្ជាប់៖</label>
        <!-- hidden file input -->
        <input type="file" id="imageInput" accept="image/*" multiple style="display: none;" onchange="handleImageSelection(event)">
        
        <div class="image-preview-container">
            <div id="imagePreviewContainer" style="display: flex; gap: 10px; flex-wrap: wrap;"></div>
            
            <!-- ប៊ូតុង + ថត/ជ្រើសរូបថែម -->
            <div class="add-more-box" onclick="triggerFileInput()">
                <span>➕</span>
                <div>ថត/បន្ថែម</div>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="reportOutput">លទ្ធផលរបាយការណ៍ (អាចកែប្រែបន្ថែមក្នុងប្រអប់នេះបាន)៖</label>
        <textarea id="reportOutput"></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-copy" onclick="copyReport()">📋 ចម្លង (Copy)</button>
        <button class="btn-telegram" onclick="shareTextOnlyToTelegram()">✈️ ផ្ញើតែអត្ថបទ (កែក្នុង Telegram បាន)</button>
        <button class="btn-telegram" style="background-color: #005580;" onclick="shareToTelegramWithFiles()">🖼️ ផ្ញើទាំងអត្ថបទ+រូបភាព</button>
    </div>

    <div class="app-license">
        🛡️ រក្សាសិទ្ធិគ្រប់យ៉ាង © <strong>បង្កើតដោយ៖ កែវ រតនា (ការិយាល័យអក្សរសម្ងាត់)</strong>
    </div>
</div>

<div id="toast" class="toast">បានចម្លងរបាយការណ៍រួចរាល់!</div>

<script>
    const khmerMonths = ["មករា", "កុម្ភៈ", "មីនា", "មេសា", "ឧសភា", "មិថុនា", "កក្កដា", "សីហា", "កញ្ញា", "តុលា", "វិច្ឆិកា", "ធ្នូ"];
    const khmerNumbers = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];

    function toKhmerNum(num) {
        if (num === undefined || num === null) return '';
        return num.toString().split('').map(n => khmerNumbers[n] || n).join('');
    }

    function getKhmerDateString(selectedDate) {
        let lunarStr = "";
        if (typeof momentkh !== 'undefined') {
            const year = selectedDate.getFullYear();
            const month = selectedDate.getMonth();
            const day = selectedDate.getDate();
            const localDate = new Date(year, month, day, 12, 0, 0); 
            const khmerObj = momentkh.fromDate(localDate);
            lunarStr = momentkh.format(khmerObj);
        } else {
            lunarStr = "ថ្ងៃសៅរ៍ ១កើត ខែភទ្របទ ឆ្នាំមមី អដ្ឋស័ក ពុទ្ធសករាជ ២៥៧០";
        }

        const solarDay = toKhmerNum(selectedDate.getDate());
        const solarMonth = khmerMonths[selectedDate.getMonth()];
        const solarYear = toKhmerNum(selectedDate.getFullYear());

        return `${lunarStr} ត្រូវនឹងថ្ងៃទី${solarDay} ខែ${solarMonth} ឆ្នាំ${solarYear}`;
    }

    function updateKhmerDate() {
        const pickerVal = document.getElementById('datePicker').value;
        if (pickerVal) {
            const parts = pickerVal.split('-');
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            document.getElementById('dateText').value = getKhmerDateString(d);
            generateReport();
        }
    }

    function autoFillTime() {
        const shift = document.getElementById('shiftTime').value;
        const timeInput = document.getElementById('timeText');
        if (shift === 'ព្រឹក') {
            timeInput.value = '០៨និង ០០នាទី';
        } else if (shift === 'រសៀល') {
            timeInput.value = '១៤និង ០០នាទី';
        } else if (shift === 'យប់') {
            timeInput.value = '២០និង ០០នាទី';
        }
    }

    function calculateDeptForce() {
        const total = parseInt(document.getElementById('totalForce').value) || 0;
        const deputy = parseInt(document.getElementById('deputyChief').value) || 0;
        const dept = total - deputy;
        document.getElementById('deptForce').value = dept > 0 ? dept : 0;
    }

    function generateReport() {
        const shift = document.getElementById('shiftTime').value;
        const timeText = document.getElementById('timeText').value;
        const dateText = document.getElementById('dateText').value;
        const totalForce = toKhmerNum(document.getElementById('totalForce').value);
        const deputyChief = toKhmerNum(document.getElementById('deputyChief').value);
        const deptForce = toKhmerNum(document.getElementById('deptForce').value);
        const receiverName = document.getElementById('receiverName').value;
        const senderName = document.getElementById('senderName').value;

        const reportTemplate = `🇰🇭.🚔ប្រចាំបញ្ជា វេនទី ២

🙏សូមគោរពរាយការណ៍ជូន 
លោកឧត្តមសេនីយ៍ត្រី ${receiverName} 
ស្នងការនគរបាលខេត្តមណ្ឌលគិរី មេត្តាជូនជ្រាបដ៏ខ្ពង់ខ្ពស់។

នា${shift} ${dateText}
វេលាម៉ោង ${timeText}។

🇰🇭🚔.នៅស្នងការដ្ឋាននគរបាលខេត្ត បានប្រជុំជួរត្រួតពិនិត្យកម្លាំងប្រចាំបញ្ជា វេនទី (២B)វិលជុំ ៖
🔹កម្លាំងមានមុខជាក់ស្ដែងសរុប ចំនួន ${totalForce}រូប ៖
🔹ស្នងការរង ចំនួន ${deputyChief}រូប ៖
🔹កម្លាំងការិ. សរុបចំនួន ${deptForce}រូប ៖

🙏អាស្រ័យហេតុនេះសូមគោរព ជូន
លោកស្នងការ មេត្តាជ្រាប ដោយក្ដីគោរព ៖

ឧត្តមសេនីយ៍ត្រី ${senderName}`;

        document.getElementById('reportOutput').value = reportTemplate;
    }

    // រក្សារូបភាព
    let selectedImageFiles = [];

    function triggerFileInput() {
        document.getElementById('imageInput').click();
    }

    function handleImageSelection(event) {
        const newFiles = Array.from(event.target.files);
        if (newFiles.length > 0) {
            selectedImageFiles = selectedImageFiles.concat(newFiles);
            renderImagePreviews();
        }
        event.target.value = '';
    }

    function renderImagePreviews() {
        const container = document.getElementById('imagePreviewContainer');
        container.innerHTML = '';

        selectedImageFiles.forEach((file, index) => {
            const wrapper = document.createElement('div');
            wrapper.className = 'image-preview-wrapper';

            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            img.className = 'image-preview-item';

            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-img-btn';
            removeBtn.innerHTML = '✕';
            removeBtn.onclick = function(e) {
                e.stopPropagation();
                removeImage(index);
            };

            wrapper.appendChild(img);
            wrapper.appendChild(removeBtn);
            container.appendChild(wrapper);
        });
    }

    function removeImage(index) {
        selectedImageFiles.splice(index, 1);
        renderImagePreviews();
    }

    function copyReport() {
        const reportArea = document.getElementById('reportOutput');
        if (!reportArea.value) generateReport();
        reportArea.select();
        reportArea.setSelectionRange(0, 99999);

        try {
            document.execCommand('copy');
            showToast();
        } catch (err) {
            alert("សូមជ្រើសរើសអត្ថបទ និងចុច Copy ដោយផ្ទាល់!");
        }
    }

    // 1. ផ្ញើតែអត្ថបទ (អាចកែប្រែក្នុង Telegram បាន ១០០%)
    function shareTextOnlyToTelegram() {
        const reportText = document.getElementById('reportOutput').value;
        if (!reportText.trim()) {
            alert("សូមបង្កើតរបាយការណ៍ជាមុនសិន!");
            return;
        }
        const telegramUrl = `https://t.me/share/url?url=&text=${encodeURIComponent(reportText)}`;
        window.open(telegramUrl, '_blank');
    }

    // 2. ផ្ញើអត្ថបទ + រូបភាព (ទាមទារ Share Sheet)
    async function shareToTelegramWithFiles() {
        const reportText = document.getElementById('reportOutput').value;
        if (!reportText.trim()) {
            alert("សូមបង្កើតរបាយការណ៍ជាមុនសិន!");
            return;
        }

        if (selectedImageFiles.length > 0 && navigator.canShare && navigator.canShare({ files: selectedImageFiles })) {
            try {
                await navigator.share({
                    text: reportText,
                    files: selectedImageFiles
                });
            } catch (err) {
                shareTextOnlyToTelegram();
            }
        } else {
            shareTextOnlyToTelegram();
        }
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.className = "toast show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    window.onload = function() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        document.getElementById('datePicker').value = `${year}-${month}-${day}`;
        document.getElementById('dateText').value = getKhmerDateString(now);
        generateReport();
    };
</script>

</body>
</html>
